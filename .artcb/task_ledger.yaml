# ═══════════════════════════════════════════════════════════════════════════════
# DÉCISIONS ARCHITECTURE (immuables — ne jamais supprimer)
# ═══════════════════════════════════════════════════════════════════════════════
decisions:

  - id: D001
    source: "rapport 367"
    title: "PIN ≠ preuve ARTCB"
    rule: "Aucun PIN, password, secret, code local n'est accepté comme preuve d'identité ou de wallet"
    status: ENFORCED
    enforcement: "R363 — credential_not_found → 401 si PIN seul"

  - id: D002
    source: "rapport 367"
    title: "face_camera = FALLBACK_ACCESSIBILITY_ONLY"
    rule: "La caméra frontale n'est pas une preuve d'identité ARTCB — non acceptée comme biometric_primary"
    status: ENFORCED
    enforcement: "R357 + reflex/core.py FACE_CAMERA_INACTIVE_PRODUCTION"

  - id: D003
    source: "rapport 367"
    title: "WebAuthn valide ≠ unique_human_proven"
    rule: >
      Une assertion WebAuthn prouve la possession d'un authenticator,
      PAS l'unicité humaine. unique_human_proven reste toujours False.
    status: ENFORCED
    enforcement: "unique_human_proven=False dans tous les records + tests"

  - id: D004
    source: "rapport 367/370"
    title: "ADD_DEVICE — aucun nouveau wallet créé"
    rule: "Un nouvel appareil REJOINT l'identité existante — ne crée pas de nouveau wallet"
    status: ENFORCED
    enforcement: "R363 — device_record ne contient pas de nouveau wallet"

  - id: D005
    source: "CERTIFIED_100 policy"
    title: "CERTIFIED_100 = False — permanent"
    rule: "Ne jamais inverser CERTIFIED_100. Pas de claim de certification sans preuve complète."
    status: PERMANENT

