      - "FHE véritable (SEAL/OpenFHE/Concrete) pour check_uniqueness — XOR hash est un stub"
      - "FAR/FRR/PAD mesurés sur vrais capteurs (NIST BSSR)"
      - "Tests SDK natif iOS/Android"
      - "UV=true ≠ empreinte vérifiée — documenter la limite WebAuthn dans le protocole ARTCB"
      - "Distinguer cas 1→5 : même humain/même appareil / même humain/nouvel appareil / multi-identités / autre humain/appareil connu / PIN seul"
      - "Anti-Sybil identity : lier authenticator credential_id à HumanID sans supposer que UV=biométrique"
    webauthn_pin_problem: >
      WebAuthn userVerification=required peut être satisfait par PIN ou biométrie
      selon l'authenticator. Le serveur ARTCB ne peut pas distinguer les deux
      depuis l'attestation seule (limite W3C documentée, issue #1728).
      Conséquence : UV=true ne doit PAS être traité comme preuve biométrique humaine.
      unique_human_proven reste False même si UV=true.
    multi_device_identity: >
      Schéma à verrouiller :
      HUMAIN → biométrie native → AUTHENTICATOR/PASSKEY → clé crypto → APPAREIL A → Wallet A.
      Même humain → APPAREIL B → tentative Wallet B : le protocole doit détecter
      si c'est un ajout légitime (ADD_DEVICE) ou une tentative de double identité économique.
      R363 gère ADD_DEVICE mais n'aborde pas l'anti-Sybil multi-wallet humain.

