  - id: TASK-001-BIOMETRIE-SUITE
    title: "TASK-001 suite : FAR/FRR + SDK iOS/Android + PIN vs biométrie WebAuthn (R374+R376 DONE)"
    priority: MEDIUM
    depends_on: "TASK-001-FUZZY-EXTRACTOR (DONE)"
    sub_tasks_done:
      - "R374 DONE : ECC externe BCH(255,191,8) — dist≤8 bits/bloc (30/30 PASS)"
