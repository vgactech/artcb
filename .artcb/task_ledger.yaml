  - id: D003
    source: "rapport 367"
    title: "WebAuthn valide ≠ unique_human_proven"
    rule: >
      Une assertion WebAuthn prouve la possession d'un authenticator,
      PAS l'unicité humaine. unique_human_proven reste toujours False.
    status: ENFORCED
    enforcement: "unique_human_proven=False dans tous les records + tests"

  - id: D004
    source: "rapport 367/370"
    title: "ADD_DEVICE — aucun nouveau wallet créé"
    rule: "Un nouvel appareil REJOINT l'identité existante — ne crée pas de nouveau wallet"
    status: ENFORCED
