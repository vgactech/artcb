name: ARTCB — Tests CI
# IMPORTANT : Ce workflow est déclenché UNIQUEMENT manuellement (workflow_dispatch).
# Il ne se déclenche JAMAIS automatiquement sur push ou pull_request.
# Seul le propriétaire du dépôt (vgac2025) peut le déclencher depuis
# GitHub Actions → "Run workflow".
#
# Pour un utilisateur qui FORK ce dépôt :
#   1. Aller dans Settings → Secrets → Actions → New repository secret
#   2. Ajouter : ARTCB_WALLET_PASSPHRASE = "votre_passphrase_secrete_min12chars"
#   3. Déclencher manuellement ce workflow depuis l'onglet Actions de son fork
#
# Les secrets NE sont JAMAIS partagés entre dépôts.
# GitHub ne transmet JAMAIS les secrets aux workflows déclenchés par un fork externe.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Raison du lancement (ex: validation avant déploiement)"
        required: false
        default: "Validation manuelle"

env:
  ARTCB_DEBUG: "true"
  ARTCB_ENCODE_MODE: "rule-based"
  ARTCB_LLM_ENABLED: "false"
  ARTCB_DATA_DIR: "/tmp/artcb_test_data"
  ARTCB_LOG_DIR: "/tmp/artcb_test_logs"
  ARTCB_ALLOW_MULTI_WALLET: "true"
  ARTCB_BOOTSTRAP_NODE: "true"

jobs:
  test:
    name: "519 tests PASS — validation manuelle"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identité d'installation unique
        run: |
          echo "=== ARTCB Node Installation Identity ==="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Actor      : $GITHUB_ACTOR"
          echo "Run ID     : $GITHUB_RUN_ID"
          echo "Reason     : ${{ inputs.reason }}"
          FINGERPRINT=$(echo "$GITHUB_REPOSITORY|$GITHUB_RUN_ID|$(hostname)" | sha256sum | cut -c1-32)
          echo "Device fingerprint : $FINGERPRINT"
          echo "DEVICE_FINGERPRINT=$FINGERPRINT" >> $GITHUB_ENV

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: System deps (liboqs pour PQC)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libssl-dev libjson-c-dev

      - name: Installer dépendances Python
        run: pip install -r requirements.txt

      - name: Créer .env depuis GitHub Secrets
        env:
          # Ce secret doit être défini dans : Settings → Secrets → Actions
          # Nom : ARTCB_WALLET_PASSPHRASE
          # Valeur : votre passphrase (min 12 caractères)
          # Si absent : valeur de dev utilisée (tests seulement, jamais en production)
          ARTCB_WALLET_PASSPHRASE: ${{ secrets.ARTCB_WALLET_PASSPHRASE }}
          KEY_API_STRIPE_ACTION: ${{ secrets.KEY_API_STRIPE_ACTION }}
        run: |
          cat > .env << EOF
          ARTCB_DEBUG=true
          ARTCB_ENCODE_MODE=rule-based
          ARTCB_LLM_ENABLED=false
          ARTCB_DATA_DIR=/tmp/artcb_test_data
          ARTCB_LOG_DIR=/tmp/artcb_test_logs
          ARTCB_ALLOW_MULTI_WALLET=true
          ARTCB_BOOTSTRAP_NODE=true
          ARTCB_WALLET_PASSPHRASE=${ARTCB_WALLET_PASSPHRASE:-artcb_ci_test_passphrase_devonly}
          EOF
          if [ -n "$KEY_API_STRIPE_ACTION" ]; then
            echo "KEY_API_STRIPE_ACTION is set for pytest (value not printed)"
          else
            echo "KEY_API_STRIPE_ACTION unset — Stripe live tests will skip"
          fi
          echo ".env créé (passphrase = ${ARTCB_WALLET_PASSPHRASE:+depuis_github_secrets} ${ARTCB_WALLET_PASSPHRASE:-valeur_dev_par_defaut})"

      - name: Compiler libartcb_chain.so (EconomicRoot v2)
        run: make -C src/c clean all test

      - name: Lancer la suite de tests complète
        env:
          KEY_API_STRIPE_ACTION: ${{ secrets.KEY_API_STRIPE_ACTION }}
          PYTHONPATH: src
        run: python3 -m pytest tests/ -q --tb=short --timeout=120

      - name: Stripe JobPayment (test mode, optional)
        env:
          KEY_API_STRIPE_ACTION: ${{ secrets.KEY_API_STRIPE_ACTION }}
          PYTHONPATH: src
        run: python3 scripts/stripe_job_payment_ci.py
        continue-on-error: true

      - name: Résumé
        if: always()
        run: |
          echo "## Résultats" >> $GITHUB_STEP_SUMMARY
          echo "- Repository : $GITHUB_REPOSITORY" >> $GITHUB_STEP_SUMMARY
          echo "- Actor : $GITHUB_ACTOR" >> $GITHUB_STEP_SUMMARY
          echo "- Fingerprint : $DEVICE_FINGERPRINT" >> $GITHUB_STEP_SUMMARY
          echo "- Reason : ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
