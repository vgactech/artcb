# Public artcb.me on :80 → uvicorn :8000. Replaces the nginx default site.
# Keep /etc/nginx/conf.d/artcb-tls.conf (:8443 IP TLS) unchanged.
# Certbot may add a sibling :443 server after HTTP-01 succeeds.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name artcb.me www.artcb.me n1.artcb.me n2.artcb.me n3.artcb.me n4.artcb.me node.artcb.me _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
